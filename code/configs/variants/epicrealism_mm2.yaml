# Experiment 2 model variant 'epicrealism_mm2' (docs/experiment2.md): the frozen protocol of
# configs/generation.yaml with only the base image model and/or the motion adapter changed.
# v1-5-3 has no mid-block motion module (use_motion_mid_block: false), so its coordinate list
# is shorter; everything downstream enumerates coordinates from the loaded UNet.

adapter_id: guoyww/animatediff-motion-adapter-v1-5-2
base_candidates:
  - emilianJR/epiCRealism

frames: 16
height: 512
width: 512
steps: 25                 # DDIM, AnimateDiff reference scheduler settings
guidance_scale: 7.5
negative_prompt: "bad quality, worse quality, blurry"
prompt_template: "a {subject} {verb} {scene}, high quality, detailed"
noise_device: cpu
noise_dtype: float16
