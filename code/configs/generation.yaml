# These settings are to be kept fixed so experiment runs are comparable
# Each script's --profile option to be used for memory-saving settings
# The video model uses a Stable Diffusion base model and an AnimateDiff motion adapter
adapter_id: guoyww/animatediff-motion-adapter-v1-5-2      # has ~417M learned parameters
# runwayml/stable-diffusion-v1-5 was withdrawn from the Hub. These are the live mirrors tried in order.
# These base models can be tried in order if one cannot be loaded
base_candidates:
  - stable-diffusion-v1-5/stable-diffusion-v1-5
  - botp/stable-diffusion-v1-5
  - emilianJR/epiCRealism

frames: 16
height: 512
width: 512
steps: 25                  # Number of DDIM steps used to generate a clip.
guidance_scale: 7.5        # Controls how strongly video generation follows the prompt. 7.5 is the AnimateDiff's default
negative_prompt: "bad quality, worse quality, blurry" # qualities the model should avoid. Here blurry and bad quality results are discouraged 
prompt_template: "a {subject} {verb} {scene}, high quality, detailed"

# Noise policy settings
noise_device: cpu #creating noise on cpu makes it consistent across GPUs, which is important for reproducibility
noise_dtype: float16
