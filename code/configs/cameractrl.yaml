# CameraCtrl cell (docs/specs/2026-11-15-cameractrl-design.md): SD1.5 + AnimateDiff v3 motion module
# + merged v3 domain-adapter LoRA + CameraCtrl pose encoder, at the setting CameraCtrl was released for.
# New file; configs/generation.yaml stays frozen.

adapter_id: guoyww/animatediff-motion-adapter-v1-5-3
base_candidates:
  - stable-diffusion-v1-5/stable-diffusion-v1-5

frames: 16
height: 256
width: 384
steps: 25                 # DDIM, the project's scheduler settings
guidance_scale: 14.0      # default of the authors' inference.py
negative_prompt: "bad quality, worse quality, blurry"
prompt_template: "{scene}, high quality, detailed"
noise_device: cpu
noise_dtype: float16

# read through GenerationConfig.extra by vdprobe.cameractrl.model
cameractrl_repo: hehao13/CameraCtrl
cameractrl_file: CameraCtrl.ckpt
domain_lora_repo: guoyww/animatediff
domain_lora_file: v3_sd15_adapter.ckpt
domain_lora_scale: 1.0
trajectory_step: 0.1      # scene units per frame for pan / tilt / zoom
trajectory_roll_deg: 2.0  # degrees per frame for roll
